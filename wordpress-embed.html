<!-- Wolkanca Oyunları #04 — WordPress → Özel HTML bloğuna yapıştır. -->
<!-- Bu URL GitHub Pages ayarı etkinleştirildikten sonra çalışır. -->
<div style="width:100%;max-width:1100px;margin-inline:auto">
  <iframe
    id="wolkanca-news-quiz"
    src="https://wolkanca.github.io/real-or-fake-news-quiz/"
    title="Gerçek Haber mi, Uydurma mı? — Wolkanca Oyunları #04"
    width="100%"
    height="1000"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="clipboard-write"
    style="display:block;width:100%;min-height:740px;border:0;border-radius:16px;background:#091020"
  ></iframe>
</div>
<script>
(() => {
  const frame = document.getElementById('wolkanca-news-quiz');
  if (!frame) return;
  window.addEventListener('message', event => {
    if (event.source !== frame.contentWindow) return;
    if (event.origin !== new URL(frame.src).origin) return;
    if (event.data?.type !== 'wolkanca-news-quiz:height') return;
    const h = Number(event.data.height);
    if (Number.isFinite(h) && h >= 400 && h <= 2600) {
      frame.style.height = Math.ceil(h + 8) + 'px';
    }
  });
})();
</script>
